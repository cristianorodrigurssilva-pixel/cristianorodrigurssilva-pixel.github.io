    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%); padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; padding: 25px; border-radius: 20px; max-width: 420px; width: 100%; box-shadow: 0 12px 30px rgba(37, 99, 235, 0.12); border: 1px solid #bfdbfe; position: relative; }
        .header { text-align: center; margin-bottom: 20px; }
        h1 { font-size: 32px; font-weight: 800; color: #1e3a8a; letter-spacing: 0.5px; }
        .pix-color { color: #06b6d4; }
        .card-recebedor { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .recebedor-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; padding-right: 10px; }
        .recebedor-nome { font-size: 14px; font-weight: 700; color: #1e3a8a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .recebedor-chave { font-size: 12px; color: #64748b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-alterar { background: none; border: none; color: #2563eb; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
        label { font-size: 14px; font-weight: 700; color: #1e3a8a; display: block; margin-top: 14px; }
        input, select { width: 100%; padding: 14px; margin-top: 6px; border: 2px solid #bfdbfe; border-radius: 10px; font-size: 18px; background: #f8fafc; color: #1e293b; }
        .input-valor { font-size: 24px; font-weight: bold; text-align: center; color: #2563eb; }
        button.btn-principal { width: 100%; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; margin-top: 16px; cursor: pointer; }
        .btn-whatsapp { background-color: #25d366 !important; color: white; margin-top: 10px; }
        #btn-instalar { background-color: #0f172a; color: white; display: none; margin-top: 15px; }
        #qrcode-container { margin-top: 20px; display: flex; justify-content: center; background: #ffffff; padding: 12px; border-radius: 12px; border: 1px dashed #38bdf8; }
        .result-box { display: none; margin-top: 15px; }
        textarea { width: 100%; height: 75px; margin-top: 8px; padding: 10px; border-radius: 10px; border: 2px solid #bfdbfe; font-family: monospace; font-size: 11px; resize: none; background: #f8fafc; color: #1e3a8a; }
        .config-box { display: none; background: #f1f5f9; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; }
        .toast { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background-color: #06b6d4; color: #0f172a; padding: 14px 24px; border-radius: 30px; font-weight: 800; font-size: 15px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25); z-index: 9999; text-align: center; white-space: nowrap; }
        .toast.show { display: block; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Qr<span class="pix-color">Pix</span></h1>
    </div>

    <div class="card-recebedor">
        <div class="recebedor-info">
            <span class="recebedor-nome" id="resumo-nome">Sem recebedor cadastrado</span>
            <span class="recebedor-chave" id="resumo-chave">Clique para configurar seus dados</span>
        </div>
        <button type="button" class="btn-alterar" onclick="toggleConfig()" id="btn-alterar-texto">Alterar</button>
    </div>

    <div id="config-box" class="config-box">
        <label for="tipoChave" style="margin-top: 0;">Tipo de Chave Pix:</label>
        <select id="tipoChave" onchange="alterarTipoChave()">
            <option value="CELULAR">Celular</option>
            <option value="CPF">CPF</option>
            <option value="CNPJ">CNPJ</option>
            <option value="EMAIL">E-mail</option>
            <option value="EVP">Chave Aleatória (EVP)</option>
        </select>

        <label for="chave" id="labelChave">Chave Pix:</label>
        <input type="text" id="chave" placeholder="(00) 00000-0000">

        <label for="nome">Nome do Recebedor:</label>
        <input type="text" id="nome" placeholder="Seu Nome">

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" placeholder="Sua Cidade">

        <button type="button" class="btn-principal" onclick="salvarEFecharConfig()" style="background-color: #0f172a; margin-top: 14px;">Salvar Dados</button>
    </div>

    <label for="valor">Digite o Valor (R$):</label>
    <input type="text" id="valor" class="input-valor" placeholder="0,00" inputmode="numeric" autofocus>

    <button type="button" class="btn-principal" onclick="gerarPix()">Gerar PIX</button>

    <div id="result" class="result-box">
        <div id="qrcode-container"></div>
        
        <label for="pix-payload">Código Pix Copia e Cola:</label>
        <textarea id="pix-payload" readonly></textarea>
        
        <button type="button" class="btn-principal btn-whatsapp" onclick="enviarWhatsApp()">Enviar por WhatsApp</button>
        <button type="button" id="btn-copiar" class="btn-principal" onclick="copiarPix()">Copiar Código Pix</button>
    </div>

    <button type="button" id="btn-instalar" class="btn-principal">Instalar App no Celular</button>
</div>

<div id="toast" class="toast">✓ Código Pix copiado!</div>

<script>
let db;
const dbName = "QrPixDatabase_V2";

function iniciarBanco() {
    return new Promise((resolve) => {
        const request = indexedDB.open(dbName, 1);
        request.onupgradeneeded = function(e) {
            let dbInstance = e.target.result;
            if (!dbInstance.objectStoreNames.contains("dados")) {
                dbInstance.createObjectStore("dados", { keyPath: "campo" });
            }
        };
        request.onsuccess = function(e) { db = e.target.result; resolve(); };
        request.onerror = function() { resolve(); };
    });
}

function salvarDado(campo, valor) {
    try { localStorage.setItem('pix_perm_' + campo, valor); } catch (e) {}
    if (db) {
        try {
            const tx = db.transaction("dados", "readwrite");
            tx.objectStore("dados").put({ campo: campo, valor: valor });
        } catch (err) {}
    }
    atualizarResumoCard();
}

function carregarDados() {
    let tipo = localStorage.getItem('pix_perm_tipoChave');
    let chave = localStorage.getItem('pix_perm_chave');
    let nome = localStorage.getItem('pix_perm_nome');
    let cidade = localStorage.getItem('pix_perm_cidade');

    if (tipo) document.getElementById('tipoChave').value = tipo;
    alterarTipoChave();
    if (chave) document.getElementById('chave').value = chave;
    if (nome) document.getElementById('nome').value = nome;
    if (cidade) document.getElementById('cidade').value = cidade;

    atualizarResumoCard();
    if (!chave || !nome || !cidade) {
        document.getElementById('config-box').style.display = 'block';
        document.getElementById('btn-alterar-texto').innerText = 'Cancelar';
    }
}

function atualizarResumoCard() {
    let nome = localStorage.getItem('pix_perm_nome') || document.getElementById('nome').value;
    let chave = localStorage.getItem('pix_perm_chave') || document.getElementById('chave').value;
    let tipo = localStorage.getItem('pix_perm_tipoChave') || document.getElementById('tipoChave').value || 'Chave';

    const lblNome = document.getElementById('resumo-nome');
    const lblChave = document.getElementById('resumo-chave');

    if (nome && chave) {
        lblNome.innerText = nome;
        lblChave.innerText = `${tipo}:${chave}`;
    } else {
        lblNome.innerText = 'Sem recebedor cadastrado';
        lblChave.innerText = 'Clique para configurar seus dados';
    }
}

function toggleConfig() {
    const box = document.getElementById('config-box');
    const btnText = document.getElementById('btn-alterar-texto');
    if (box.style.display === 'block') {
        box.style.display = 'none';
        btnText.innerText = 'Alterar';
    } else {
        box.style.display = 'block';
        btnText.innerText = 'Cancelar';
    }
}

function salvarEFecharConfig() {
    let tipo = document.getElementById('tipoChave').value;
    let chave = document.getElementById('chave').value.trim();
    let nome = document.getElementById('nome').value.trim();
    let cidade = document.getElementById('cidade').value.trim();

    if (!chave || !nome || !cidade) {
        alert('Por favor, preencha todos os dados do recebedor.');
        return;
    }

    salvarDado('tipoChave', tipo);
    salvarDado('chave', chave);
    salvarDado('nome', nome);
    salvarDado('cidade', cidade);

    document.getElementById('config-box').style.display = 'none';
    document.getElementById('btn-alterar-texto').innerText = 'Alterar';
}

function alterarTipoChave() {
    const tipo = document.getElementById('tipoChave').value;
    const label = document.getElementById('labelChave');
    const input = document.getElementById('chave');
    salvarDado('tipoChave', tipo);

    if (tipo === 'CELULAR') { label.innerText = 'Chave Pix (DDD + Número):'; input.placeholder = '(00) 00000-0000'; }
    else if (tipo === 'CPF') { label.innerText = 'Chave Pix (CPF):'; input.placeholder = '000.000.000-00'; }
    else if (tipo === 'CNPJ') { label.innerText = 'Chave Pix (CNPJ):'; input.placeholder = '00.000.000/0001-00'; }
    else if (tipo === 'EMAIL') { label.innerText = 'Chave Pix (E-mail):'; input.placeholder = 'seuemail@exemplo.com'; }
    else if (tipo === 'EVP') { label.innerText = 'Chave Aleatória (EVP):'; input.placeholder = '00000000-0000-0000-0000-000000000000'; }
}

document.addEventListener('DOMContentLoaded', async function() {
    await iniciarBanco();
    carregarDados();
    document.getElementById('chave').addEventListener('input', (e) => salvarDado('chave', e.target.value));
    document.getElementById('nome').addEventListener('input', (e) => salvarDado('nome', e.target.value));
    document.getElementById('cidade').addEventListener('input', (e) => salvarDado('cidade', e.target.value));
});

document.getElementById('valor').addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    if (!value) { e.target.value = ''; return; }
    e.target.value = (parseInt(value, 10) / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
});

function CRC16(str) {
    let crc = 0xFFFF;
    const bytes = new TextEncoder().encode(str);
    for (let c = 0; c < bytes.length; c++) {
        crc ^= bytes[c] << 8;
        for (let i = 0; i < 8; i++) {
            crc = (crc & 0x8000) !== 0 ? (crc << 1) ^ 0x1021 : crc << 1;
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function formatField(id, value) {
    const len = new TextEncoder().encode(value).length.toString().padStart(2, '0');
    return id + len + value;
}

function limparTexto(texto) {
    if (!texto) return '';
    let t = texto.replace(/&/g, 'E').normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9 ]/g, "");
    return t.trim().toUpperCase();
}

function tratarChavePixPorTipo(c, tipo) {
    if (!c) return '';
    if (tipo === 'EMAIL' || tipo === 'EVP') return c.toLowerCase().trim();
    let apenasNumeros = c.replace(/\D/g, '');
    if (tipo === 'CPF' || tipo === 'CNPJ') return apenasNumeros;
    if (tipo === 'CELULAR') {
        if (c.startsWith('+55')) return '+55' + apenasNumeros.substring(2);
        return '+55' + apenasNumeros;
    }
    return c;
}

function gerarPix() {
    let tipo = document.getElementById('tipoChave').value || localStorage.getItem('pix_perm_tipoChave') || 'CELULAR';
    let chaveBruta = document.getElementById('chave').value || localStorage.getItem('pix_perm_chave') || '';
    let nomeOriginal = document.getElementById('nome').value || localStorage.getItem('pix_perm_nome') || '';
    let cidadeOriginal = document.getElementById('cidade').value || localStorage.getItem('pix_perm_cidade') || '';
    let valorInput = document.getElementById('valor').value;

    let chave = tratarChavePixPorTipo(chaveBruta, tipo);
    let nome = limparTexto(nomeOriginal).substring(0, 25);
    let cidade = limparTexto(cidadeOriginal).substring(0, 15);

    if (!chave || !nome || !cidade) {
        alert('Por favor, preencha todos os dados do recebedor.');
        document.getElementById('config-box').style.display = 'block';
        document.getElementById('btn-alterar-texto').innerText = 'Cancelar';
        return;
    }

    let payload = formatField('00', '01') + formatField('01', '12');
    payload += formatField('26', formatField('00', 'BR.GOV.BCB.PIX') + formatField('01', chave));
    payload += formatField('52', '0000') + formatField('53', '986');

    if (valorInput) {
        let valorNum = parseFloat(valorInput.replace(/\./g, '').replace(',', '.').trim());
        if (!isNaN(valorNum) && valorNum > 0) payload += formatField('54', valorNum.toFixed(2));
    }

    payload += formatField('58', 'BR') + formatField('59', nome) + formatField('60', cidade);
    payload += formatField('62', formatField('05', '***')) + '6304';
    payload += CRC16(payload);

    document.getElementById('result').style.display = 'block';
    document.getElementById('pix-payload').value = payload;
    
    const qrContainer = document.getElementById('qrcode-container');
    qrContainer.innerHTML = '';

    setTimeout(() => {
        if (typeof QRCode === 'undefined') {
            alert('Erro: Biblioteca do QR Code não encontrada.');
            return;
        }
        new QRCode(qrContainer, { text: payload, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M });
    }, 50);
}

function mostrarAviso(msg) {
    const toast = document.getElementById('toast');
    const btn = document.getElementById('btn-copiar');
    toast.innerText = msg || '✓ Código Pix copiado!';
    toast.classList.add('show');
    btn.innerText = '✓ Código Copiado!';
    setTimeout(() => { toast.classList.remove('show'); btn.innerText = 'Copiar Código Pix'; }, 2200);
}

async function copiarParaClipboardAssincrono(texto) {
    if (navigator.clipboard && window.isSecureContext) {
        try { await navigator.clipboard.writeText(texto); return true; } catch (err) {}
    }
    return false;
}

function copiarPix(silencioso = false) {
    const payloadInput = document.getElementById('pix-payload');
    const texto = payloadInput ? payloadInput.value.trim() : '';
    if (!texto) return;
    copiarParaClipboardAssincrono(texto).then((sucesso) => {
        if (!sucesso) { try { payloadInput.select(); document.execCommand('copy'); } catch (e) {} }
        if (!silencioso) mostrarAviso();
    });
}

// --- WHATSAPP COM AS FIGURINHAS E CÓDIGO PIX EM BLOCO DE CÓDIGO (TRIPLE BACKTICKS) ---
async function enviarWhatsApp() {
    const payloadInput = document.getElementById('pix-payload');
    const pixCode = payloadInput ? payloadInput.value.trim() : '';
    if (!pixCode) { alert('Gere o código Pix antes de enviar!'); return; }

    await copiarParaClipboardAssincrono(pixCode);
    mostrarAviso('✓ Pix copiado! Cole a chave após enviar.');

    const nome = localStorage.getItem('pix_perm_nome') || 'Recebedor';
    const valor = document.getElementById('valor').value || '0,00';

    // As aspas triplas (```) envolvem o payload para gerar o bloco com botão de cópia nativa no WhatsApp
    const mensagemResumo = `💠 *DADOS PARA PAGAMENTO PIX*\n\n` +
                           `👤 Recebedor: ${nome}\n` +
                           `💵 Valor: R$ ${valor}\n\n` +
                           `👇 Código Pix Copia e Cola:\n` +
                           `\`\`\`\n${pixCode}\n\`\`\``;

    const urlFinal = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagemResumo)}`;
    setTimeout(() => { window.open(urlFinal, '_blank'); }, 200);
}
