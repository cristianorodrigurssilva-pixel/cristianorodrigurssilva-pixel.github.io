<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador Pix</title>
<!-- Usa a biblioteca local qrcode.min.js para funcionar perfeitamente offline -->
<script src="qrcode.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
<div class="bg-white p-6 rounded-2xl shadow-xl w-full max-w-md">
<h1 class="text-xl font-bold text-center mb-4 text-gray-800">Gerador de QR Code Pix</h1>
​<div class="space-y-4">
<div>
<label class="block text-sm font-medium text-gray-700">Chave Pix</label>
<input type="text" id="pixKey" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="CPF, E-mail, Telefone ou Chave Aleatória">
</div>
<div>
<label class="block text-sm font-medium text-gray-700">Nome do Recebedor</label>
<input type="text" id="pixName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Nome Completo">
</div>
<div>
<label class="block text-sm font-medium text-gray-700">Cidade</label>
<input type="text" id="pixCity" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="Ex: Fortaleza">
</div>
<div>
<label class="block text-sm font-medium text-gray-700">Valor (R$)</label>
<input type="number" step="0.01" id="pixAmount" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="0.00">
</div>
​<button onclick="generateQRCode()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold hover:bg-green-700 transition">Gerar Pix</button>
</div>
​<div id="resultContainer" class="mt-6 hidden flex flex-col items-center">
<div id="qrcode" class="mb-4 flex justify-center"></div>
<textarea id="pixCopyPaste" readonly class="w-full h-24 text-xs p-2 border rounded bg-gray-50 mb-4"></textarea>
​<div class="flex gap-2 w-full">
<button onclick="copyPix()" class="flex-1 bg-blue-600 text-white p-2 rounded-lg font-semibold hover:bg-blue-700 transition">Copiar Código</button>
<button onclick="shareWhatsApp()" class="flex-1 bg-emerald-600 text-white p-2 rounded-lg font-semibold hover:bg-emerald-700 transition">Enviar WhatsApp</button>
</div>
</div>
</div>
​<script>
// Função de cálculo CRC16 para o padrão Pix (BR Code)
function calculateCRC16(payload) {
let polinomio = 0x1021;
let resultado = 0xFFFF;
​if (typeof payload === 'string') {
for (let i = 0; i < payload.length; i++) {
let c = payload.charCodeAt(i);
resultado ^= (c << 8);
for (let j = 0; j < 8; j++) {
if ((resultado & 0x8000) !== 0) {
resultado = ((resultado << 1) ^ polinomio) & 0xFFFF;
} else {
resultado = (resultado << 1) & 0xFFFF;
}
}
}
}
return resultado.toString(16).toUpperCase().padStart(4, '0');
}
​function formatField(id, value) {
let len = value.length.toString().padStart(2, '0');
return id + len + value;
}
​function generatePixPayload() {
let key = document.getElementById('pixKey').value.trim();
let name = document.getElementById('pixName').value.trim();
let city = document.getElementById('pixCity').value.trim();
let amount = document.getElementById('pixAmount').value.trim();
​if (!key || !name || !city) {
alert('Preencha pelo menos a chave, nome e cidade.');
return null;
}
​let gui = formatField('00', 'br.gov.bcb.pix');
let keyField = formatField('01', key);
let merchantAccount = formatField('26', gui + keyField);
​let mcc = formatField('52', '0000');
let currency = formatField('53', '986');
​let amountField = '';
if (amount && parseFloat(amount) > 0) {
amountField = formatField('54', parseFloat(amount).toFixed(2));
}
​let country = formatField('58', 'BR');
let merchantName = formatField('59', name);
let merchantCity = formatField('60', city);
​let additionalData = formatField('05', '***');
let additionalField = formatField('62', additionalData);
​let payloadWithoutCRC =
formatField('00', '01') +
merchantAccount +
mcc +
currency +
amountField +
country +
merchantName +
merchantCity +
additionalField +
'6304';
​let crc = calculateCRC16(payloadWithoutCRC);
return payloadWithoutCRC + crc;
}
​let qrInstance = null;
​function generateQRCode() {
let payload = generatePixPayload();
if (!payload) return;
​document.getElementById('pixCopyPaste').value = payload;
document.getElementById('resultContainer').classList.remove('hidden');
​let qrcodeEl = document.getElementById('qrcode');
qrcodeEl.innerHTML = '';
​qrInstance = new QRCode(qrcodeEl, {
text: payload,
width: 200,
height: 200,
colorDark: "#000000",
colorLight: "#ffffff",
correctLevel: QRCode.CorrectLevel.H
});
}
​function copyPix() {
let copyText = document.getElementById('pixCopyPaste');
copyText.select();
copyText.setSelectionRange(0, 99999);
navigator.clipboard.writeText(copyText.value);
alert('Código Pix copiado com sucesso!');
}
​function shareWhatsApp() {
let name = document.getElementById('pixName').value.trim();
let amount = document.getElementById('pixAmount').value.trim();
let payload = document.getElementById('pixCopyPaste').value;
​// Envolve o payload em crases triplas ('') para que o WhatsApp exiba em formato // de bloco de código, impedindo que o final vire um link azul de telefone. let message = `💎 *DADOS PARA PAGAMENTO VIA PIX*\n\n` + `👤 *Recebedor:* ${name}\n` + `💵 *Valor:* R$ ${amount ? parseFloat(amount).toFixed(2) : '0,00'}\n\n` + `👉 *Código Pix Copia e Cola:*\n\n` + '' + payload + '```';
​let whatsappUrl = https://api.whatsapp.com/send?text=${encodeURIComponent(message)};
window.open(whatsappUrl, '_blank');
}
</script>
</body>
</html>
