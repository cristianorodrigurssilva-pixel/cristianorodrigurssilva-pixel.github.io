<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fundo azul escuro arredondado -->
  <rect width="512" height="512" rx="120" fill="#0d1b2a"/>
  
  <!-- Moldura de escaneamento -->
  <path d="M120 180 V130 H170" stroke="#38bdf8" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M342 130 H392 V180" stroke="#1e3a8a" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M120 332 V382 H170" stroke="#1e3a8a" stroke-width="16" stroke-linecap="round" fill="none"/>
  <circle cx="365" cy="365" r="10" fill="#38bdf8"/>

  <!-- Símbolo Pix estilizado -->
  <g transform="translate(256, 250) scale(1.1)">
    <!-- Losango superior -->
    <polygon points="0,-60 42,-18 0,24 -42,-18" fill="#38bdf8"/>
    <!-- Losango esquerdo -->
    <polygon points="-60,0 -18,42 -60,84 -102,42" fill="#1e3a8a"/>
    <!-- Losango inferior -->
    <polygon points="0,60 42,102 0,144 -42,102" fill="#2563eb"/>
    <!-- Losango direito -->
    <polygon points="60,0 102,42 60,84 18,42" fill="#06b6d4"/>
    <!-- Centro branco -->
    <polygon points="0,-10 10,0 0,10 -10,0" fill="#ffffff"/>
  </g>

  <!-- Texto QR Pix com preservação explícita de espaço -->
  <text x="256" y="430" font-family="'Segoe UI', Arial, sans-serif" font-weight="bold" font-size="42" text-anchor="middle" xml:space="preserve"><tspan fill="#ffffff">QR </tspan><tspan fill="#38bdf8">Pix</tspan></text>
</svg>
